<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAPPY BIRTHDAY</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hbd.css">
</head>
<body class="waiting">

  <h1 id="title" class="pop-in" aria-label="HAPPY BIRTHDAY">HAPPY BIRTHDAY TO YOU!</h1>

  <div class="cake intro" id="cake" aria-label="Birthday cake">
    <div class="candles">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
    <div class="frosting"></div>
    <div class="body"></div>
    <div class="face">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="mouth"></div>
  </div>

  <button id="playBtn">Click for a surprise</button>

  <div id="confetti" aria-hidden="true"></div>

  <script src="hbd.js"></script>
</body>
</html>
